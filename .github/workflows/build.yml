name: Build firmware

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Create a release with this tag (e.g. v1.0.0), leave empty for a plain build'
        required: false
        default: ''

permissions:
  contents: write

env:
  PICO_SDK_VERSION: 2.1.1

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags are needed for the version (git describe)
          fetch-depth: 0

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib cmake ninja-build

      - name: Cache Pico SDK
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: pico-sdk
          key: pico-sdk-${{ env.PICO_SDK_VERSION }}

      - name: Fetch Pico SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$PICO_SDK_VERSION" https://github.com/raspberrypi/pico-sdk
          git -C pico-sdk submodule update --init --depth 1 lib/tinyusb

      - name: Build
        run: |
          export PICO_SDK_PATH="$GITHUB_WORKSPACE/pico-sdk"
          # Releases report their tag as version, other builds use git describe
          VERSION="${{ inputs.release_tag }}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION="$GITHUB_REF_NAME"; fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release ${VERSION:+-DFIRMWARE_VERSION=$VERSION}
          # smart_lcc has to be built before smart_lcc_combined, see README
          cmake --build build --target smart_lcc
          cmake --build build --target smart_lcc_combined

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: |
            build/smart_lcc_app.bin
            build/smart_lcc_combined.uf2

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          # For a manual run the tag is created on the built commit
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            build/smart_lcc_app.bin
            build/smart_lcc_combined.uf2
            tools/flash_wifi.py
